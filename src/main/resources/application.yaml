fint:
  application-id: fint-flyt-integration-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: always

spring:
  jpa:
    properties:
      javax.persistence.validation.mode: none
      jakarta.persistence.validation.mode: none
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-postgres
      - flyt-authorization-client
      - flyt-web-resource-server
      - flyt-authorization-client
  output:
    ansi:
      enabled: always
